spring:
  application:
    name: ai-personal-workspace
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  jooq:
    sql-dialect: postgres

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  file-extraction:
    enabled: ${FILE_EXTRACTION_ENABLED:false}
    image: ${FILE_PARSER_IMAGE:workspace-file-parser:0.2}
  file-purge:
    enabled: ${FILE_PURGE_ENABLED:false}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    profile-id: ${STORAGE_PROFILE_ID:rustfs-local}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://127.0.0.1:9000}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:personal-ai-workspace-dev}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style: true
      integrity-mode: READBACK_SHA256
  request-id-header: X-Request-Id
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5176
      - http://127.0.0.1:5176
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Request-Id
      - Idempotency-Key
      - If-Match
    allow-credentials: true
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login-rate-limit:
      limit: 10
      window: 1m
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: false
      same-site: Lax
    password:
      encoder: argon2

springdoc:
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false
  writer-with-order-by-keys: true
  override-with-generic-response: false

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: AI Personal Workspace API

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} requestId=%X{requestId} - %msg%n"
