spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 4

app:
  security:
    jwt:
      secret: test-secret-please-do-not-use-in-prod-32b
      access-token-ttl: 5m
      refresh-token-ttl: 1h
    login-rate-limit:
      limit: 1000
      window: 1m
    refresh-cookie:
      name: refresh_token
      path: /api/v1/auth
      secure: false
      same-site: Lax

logging:
  level:
    root: WARN
    com.example.workspace: INFO
